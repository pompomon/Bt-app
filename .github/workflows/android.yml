name: Android validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Validate
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache test lint

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Build debug APK
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bt-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
